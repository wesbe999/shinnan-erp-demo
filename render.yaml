services:
  - type: web
    name: shinnan-erp-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: XUNNAN_DB_PATH
        value: /var/data/xunnan_dispatch.db
      - key: XUNNAN_DATA_DIR
        value: /var/data/data
