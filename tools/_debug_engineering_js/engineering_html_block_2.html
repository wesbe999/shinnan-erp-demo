  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #edf2f7;
      color: #102348;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;

    .portrait-warning {
      display: none;

      padding: 28px 20px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #eef4fb;
    }

    .portrait-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 22px;
      border-radius: 24px;
      background: #fff;
      border: 1px solid #d7e1ef;
      box-shadow: 0 14px 32px rgba(15,23,42,.1);

    .portrait-title {
      color: #102348;
      font-size: 26px;
      font-weight: 1000;
      line-height: 1.25;
    }

    .portrait-text {
      margin-top: 12px;
      color: #64748b;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.55;
    }

    .landscape-page {
      min-height: 100vh;
      padding: 12px;
      background: #eef4fb;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 62px;
      padding: 10px 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2f7d7d, #365ee8 55%, #6d35e8);
      color: #fff;
      box-shadow: 0 10px 24px rgba(15,23,42,.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex: 0 0 42px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 1000;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin-top: 3px;
      color: #fbbf24;
      font-size: 13px;
      font-weight: 1000;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-line {
      color: #fbbf24;
      font-size: 14px;
      font-weight: 1000;
      white-space: nowrap;
    }

    .topbar button {
      height: 38px;
      border: 0;
      border-radius: 12px;
      padding: 0 14px;
      background: #fff;
      color: #102348;
      font-size: 13px;
      font-weight: 1000;
      box-shadow: 0 8px 18px rgba(15,23,42,.12);

      white-space: nowrap;
    }

    .layout {
      display: block;
      margin-top: 12px;
    }

    .side {
      display: none;
    }

    .schedule-wrap {
      overflow: auto;
      border-radius: 18px;
      background: #fff;
      border: 1px solid #d7e1ef;
      box-shadow: 0 8px 22px rgba(15,23,42,.07);
      max-height: calc(100vh - 98px);
    }

    .schedule-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .schedule-table th {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 6px 4px;
      background: #eff6ff;
      color: #1e3a8a;
      border: 1px solid #dbeafe;
      font-size: 11px;
      font-weight: 1000;
      white-space: nowrap;
      text-align: center;
    }

    .schedule-table th:first-child {
      left: 0;
      z-index: 8;
      background: #f8fafc;
      color: #102348;
      text-align: left;
      width: 118px;
    }

    .schedule-table td {
      height: 38px;
      padding: 0;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #102348;
      font-size: 11px;
      font-weight: 900;
      vertical-align: middle;
      text-align: center;
      position: relative;
      overflow: visible;
    }

    .schedule-table td:first-child {
      position: sticky;
      left: 0;
      z-index: 4;
      background: #fff;
      text-align: left;
      width: 118px;
      overflow: hidden;
    }

    .building-name {
      color: #102348;
      font-size: 12px;
      font-weight: 1000;
      line-height: 1.2;
    }

    .building-sub {
      margin-top: 2px;

      font-size: 9px;
      font-weight: 900;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .week-cell {
      position: relative;
      height: 38px;
      display: block;
      background:
        linear-gradient(to right, transparent 0, transparent calc(100% / 63 - 1px), #eef2f7 calc(100% / 63 - 1px), #eef2f7 calc(100% / 63));
      background-size: calc(100% / 63) 100%;
      overflow: hidden;
    }

    .bar {
      position: absolute;
      top: 9px;
      height: 20px;
      border-radius: 0;
      padding: 0;
      font-size: 0;
      line-height: 0;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(15,23,42,.10);
      z-index: 3;
    }

    .bar.survey {
      background: #fde047;

    }

      background: #bbf7d0;
      border: 1px solid #22c55e;
    }

    .bar.acceptance {

      border: 1px solid #f97316;
    }

      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px 10px;
      border-top: 1px solid #e2e8f0;

      font-size: 11px;

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function parseDateOnly(value) {
      const raw = String(value || "").trim();
      const parts = raw.split("-");
      if (parts.length !== 3) return null;
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    function formatMonthDay(date) {
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return mm + "/" + dd;
    }

    function addDays(date, days) {
      const d = new Date(date.getTime());
      d.setDate(d.getDate() + days);
      return d;
    }

    function setText(id, value) {
      const box = document.getElementById(id);
      if (box) box.textContent = value;
    }

    function getScheduleWeeks(items) {
      const stageDates = [];

      items.forEach(function(item) {
        const survey = parseDateOnly(item.surveyDate);
        const start = parseDateOnly(item.startDate);
        const end = parseDateOnly(item.endDate);
        const acceptance = parseDateOnly(item.acceptanceDate);

        if (survey) stageDates.push(survey);
        if (start) stageDates.push(start);
        if (end) stageDates.push(end);
        if (acceptance) stageDates.push(acceptance);
      });

      stageDates.sort((a, b) => a - b);

      const first = stageDates[0] || new Date();

      const rangeStart = new Date(first.getFullYear(), first.getMonth(), 1);
      const rangeEnd = new Date(first.getFullYear(), first.getMonth() + 2, 0);

      const weeks = [];
      let cursor = new Date(rangeStart.getTime());
      const monthWeekCounter = {};

      while (cursor <= rangeEnd) {
        const weekStart = new Date(cursor.getTime());
        let weekEnd = addDays(weekStart, 6);

        if (weekEnd > rangeEnd) {
          weekEnd = new Date(rangeEnd.getTime());
        }

        const monthNumber = weekStart.getMonth() + 1;
        monthWeekCounter[monthNumber] = (monthWeekCounter[monthNumber] || 0) + 1;

        weeks.push({
          label: monthNumber + "月第" + monthWeekCounter[monthNumber] + "周",
          rangeLabel: formatMonthDay(weekStart) + "-" + formatMonthDay(weekEnd),
          start: weekStart,
          end: weekEnd
        });

        cursor = addDays(weekEnd, 1);
      }

      return {
        weeks: weeks,
        rangeStart: rangeStart,
        rangeEnd: rangeEnd
      };
    }

    function daysBetween(a, b) {
      return Math.round((b - a) / (1000 * 60 * 60 * 24));
    }

    function clampDate(date, minDate, maxDate) {
      if (date < minDate) return minDate;
      if (date > maxDate) return maxDate;
      return date;
    }

    function projectOverlapsRange(start, end, rangeStart, rangeEnd) {
      if (!start || !end) return false;
      return start <= rangeEnd && end >= rangeStart;
    }

    function buildStageBar(stage, rangeStart, rangeEnd, totalDays) {
      if (!projectOverlapsRange(stage.start, stage.end, rangeStart, rangeEnd)) {
        return "";
      }

      const barStart = clampDate(stage.start, rangeStart, rangeEnd);
      const barEnd = clampDate(stage.end, rangeStart, rangeEnd);

      const startOffset = daysBetween(rangeStart, barStart);
      const endOffset = daysBetween(rangeStart, barEnd);

      const leftPercent = (startOffset / totalDays) * 100;
      const widthPercent = ((endOffset - startOffset + 1) / totalDays) * 100;

      return `
        <div
          class="bar ${escapeHtml(stage.className)}"
          style="left:${leftPercent}%;width:${widthPercent}%;">
        </div>
      `;
    }

    function getProjectStages(item) {
      const stages = [];

      const surveyDate = parseDateOnly(item.surveyDate);
      const constructionStart = parseDateOnly(item.startDate);
      const constructionEnd = parseDateOnly(item.endDate);
      const explicitAcceptanceDate = parseDateOnly(item.acceptanceDate);
      const acceptanceDate = explicitAcceptanceDate || (constructionEnd ? addDays(constructionEnd, 7) : null);

      if (surveyDate) {
        stages.push({
          label: "勘場",
          className: "survey",
          start: surveyDate,
          end: surveyDate
        });
      }

      if (constructionStart && constructionEnd) {
        stages.push({
          label: "施工",
          className: "construction",
          start: constructionStart,
          end: constructionEnd
        });
      }

      if (acceptanceDate) {
        stages.push({
          label: "驗收",
          className: "acceptance",
          start: acceptanceDate,
          end: acceptanceDate
        });
      }

      return stages;
    }

    function renderScheduleTable() {
      const wrap = document.getElementById("schedule_wrap");
      if (!wrap) return;

      const timeline = getScheduleWeeks(engineeringSchedules);
      const weeks = timeline.weeks;
      const rangeStart = timeline.rangeStart;
      const rangeEnd = timeline.rangeEnd;
      const totalDays = daysBetween(rangeStart, rangeEnd) + 1;

      const head = weeks.map(function(week) {
        return `<th>${escapeHtml(week.label)}<br><span style="font-size:8px;color:#64748b;">${escapeHtml(week.rangeLabel)}</span></th>`;
      }).join("");

      const rows = engineeringSchedules.map(function(item) {
        const stages = getProjectStages(item);

        const bars = stages.map(function(stage) {
          return buildStageBar(stage, rangeStart, rangeEnd, totalDays);
        }).join("");

        return `
          <tr>
            <td>
              <div class="building-name">${escapeHtml(item.building)}</div>
              <div class="building-sub">${escapeHtml(item.title)}</div>
            </td>
            <td colspan="${weeks.length}">
              <div class="week-cell">
                ${bars}
              </div>
            </td>
          </tr>
        `;
      }).join("");

      wrap.innerHTML = `
        <table class="schedule-table">
          <thead>
            <tr>
              <th>大樓 / 工程</th>
              ${head}
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>

        <div class="timeline-legend">
          <span class="timeline-legend-item"><span class="timeline-legend-color survey"></span>勘場</span>
          <span class="timeline-legend-item"><span class="timeline-legend-color construction"></span>施工</span>
          <span class="timeline-legend-item"><span class="timeline-legend-color acceptance"></span>驗收</span>
        </div>
      `;
    }

    renderScheduleTable();
  </script>
</body>
</html>
