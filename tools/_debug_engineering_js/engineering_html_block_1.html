
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>訊南工程 APP｜訊南 ERP</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #edf2f7;
      color: #102348;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: #eef4fb;
      padding-bottom: 78px;
    }

    .top {
      margin: 0;
      padding: 8px 18px 14px;
      min-height: 116px;
      background: linear-gradient(135deg, #2f7d7d, #365ee8 55%, #6d35e8);
      color: #fff;
      text-align: center;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .12);
    }

    .title {
      margin: 0;
      padding: 0;
      transform: translateY(-2px);
      font-size: 28px;
      line-height: 1;
      font-weight: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.02em;
    }

    .title-logo,
    .title-logo-img {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      object-fit: contain;
      display: inline-block;
    }

    .user {
      margin-top: 8px;
      color: #fbbf24;
      font-size: 22px;
      line-height: 1.1;
      font-weight: 1000;
    }

    .sub {
      margin-top: 5px;
      color: rgba(255,255,255,.9);
      font-size: 12px;
      font-weight: 850;
    }

    .content {
      padding: 14px 16px 22px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .summary-card {
      min-height: 74px;
      padding: 11px 10px;
      border-radius: 17px;
      border: 1px solid #d7e1ef;
      background: #fff;
      box-shadow: 0 10px 24px rgba(15,23,42,.08);
    }

    .summary-label {
      color: #64748b;
      font-size: 12px;
      font-weight: 1000;
    }

    .summary-value {
      margin-top: 7px;
      color: #102348;
      font-size: 25px;
      line-height: 1;
      font-weight: 1000;
    }

    .section-title {
      margin: 18px 4px 10px;
      color: #475569;
      font-size: 15px;
      font-weight: 1000;
    }

    .notice {
      margin-bottom: 12px;
      padding: 11px 13px;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.45;
      box-shadow: 0 8px 22px rgba(15, 23, 42, .06);
    }

    .timeline-wrap {
      margin-bottom: 14px;
      padding: 10px;
      border-radius: 18px;
      border: 1px solid #d7e1ef;
      background: #fff;
      box-shadow: 0 10px 24px rgba(15,23,42,.08);
      overflow-x: auto;
    }

    .timeline-title {
      margin: 0 0 8px;
      color: #475569;
      font-size: 13px;
      font-weight: 1000;
    }

    .timeline-table {
      min-width: 360px;
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .timeline-table th {
      padding: 6px 4px;
      background: #eff6ff;
      color: #1e3a8a;
      border: 1px solid #dbeafe;
      font-size: 11px;
      font-weight: 1000;
      text-align: center;
      white-space: nowrap;
    }

    .timeline-table th.building-col {
      width: 78px;
      text-align: left;
      background: #f8fafc;
      color: #102348;
    }

    .timeline-table td {
      height: 38px;
      padding: 3px;
      border: 1px solid #e2e8f0;
      background: #fff;
      text-align: center;
      vertical-align: middle;
      overflow: hidden;
    }

    .timeline-building {
      color: #102348;
      font-size: 11px;
      font-weight: 1000;
      text-align: left;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timeline-bar {
      height: 24px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      font-size: 10px;
      font-weight: 1000;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: inset 0 0 0 1px rgba(15,23,42,.04);
    }

    .timeline-bar.施工中 {
      background: #dcfce7;
      color: #166534;
    }

    .timeline-bar.待施工 {
      background: #fef3c7;
      color: #92400e;
    }

    .timeline-bar.待驗收 {
      background: #ede9fe;
      color: #5b21b6;
    }

    .timeline-empty {
      height: 24px;
    }

    .schedule-list {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 2px 2px 12px;
    }

    .schedule-card {
      flex: 0 0 88%;
      width: 88%;
      max-width: 360px;
      padding: 14px 15px;
      scroll-snap-align: start;
      border: 1px solid #d7e1ef;
      border-radius: 20px;
      background: #fff;
      text-align: left;
      box-shadow: 0 10px 26px rgba(15, 23, 42, .08);
      cursor: pointer;
    }

    .schedule-card:active {
      transform: scale(.99);
    }

    .schedule-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .project-title {
      color: #102348;
      font-size: 19px;
      font-weight: 1000;
      line-height: 1.25;
    }

    .project-building {
      margin-top: 4px;
      color: #64748b;
      font-size: 14px;
      font-weight: 950;
      line-height: 1.25;
    }

    .status-badge {
      min-width: 70px;
      min-height: 36px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: 1000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
    }

    .status-badge.施工中 {
      background: #dcfce7;
      color: #166534;
    }

    .status-badge.待施工 {
      background: #fef3c7;
      color: #92400e;
    }

    .status-badge.待驗收 {
      background: #ede9fe;
      color: #5b21b6;
    }

    .project-meta {
      margin-top: 11px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .meta-box {
      padding: 8px 9px;
      border-radius: 12px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.35;
    }

    .meta-box strong {
      display: block;
      margin-top: 2px;
      color: #102348;
      font-size: 14px;
      font-weight: 1000;
    }

    .project-note {
      margin-top: 9px;
      padding: 9px 10px;
      border-radius: 12px;
      background: #f8fafc;
      color: #475569;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .work-panel {
      display: none;
    }

    .project-detail-card {
      padding: 14px 15px;
      border: 1px solid #d7e1ef;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 10px 26px rgba(15, 23, 42, .08);
      margin-bottom: 12px;
    }

    .detail-title {
      color: #102348;
      font-size: 20px;
      font-weight: 1000;
      line-height: 1.25;
    }

    .detail-sub {
      margin-top: 5px;
      color: #64748b;
      font-size: 14px;
      font-weight: 950;
      line-height: 1.35;
    }

    .detail-note {
      margin-top: 9px;
      color: #475569;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .card {
      width: 100%;
      min-height: 88px;
      padding: 15px 16px;
      border: 1px solid #d7e1ef;
      border-radius: 20px;
      background: #fff;
      text-align: left;
      box-shadow: 0 10px 26px rgba(15, 23, 42, .08);
      cursor: pointer;
    }

    .card:active {
      transform: scale(.99);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }

    .card-title {
      color: #102348;
      font-size: 19px;
      font-weight: 1000;
      line-height: 1.2;
    }

    .card-tag {
      flex: 0 0 auto;
      padding: 5px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 12px;
      font-weight: 1000;
    }

    .card-desc {
      margin-top: 7px;
      color: #64748b;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.45;
    }

    .check-list {
      margin-top: 9px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .check-item {
      padding: 7px 8px;
      border-radius: 10px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.25;
    }

    .back-project-btn {
      width: 100%;
      height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: #102348;
      font-size: 16px;
      font-weight: 1000;
      box-shadow: 0 8px 20px rgba(15, 23, 42, .08);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 4px;
      padding: 8px 8px 12px;
      background: rgba(238,244,251,.96);
      border-top: 1px solid #d7e1ef;
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .bottom-nav button {
      height: 42px;
      min-width: 0;
      border: 0;
      border-radius: 12px;
      background: #fff;
      color: #102348;
      font-size: 11px;
      font-weight: 1000;
      box-shadow: 0 6px 14px rgba(15, 23, 42, .08);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bottom-nav button.primary {
      background: #4f63e8;
      color: #fff;
    }

    .bottom-nav button.green {
      background: #16a34a;
      color: #fff;
    }

    .bottom-nav button.orange {
      background: #f97316;
      color: #fff;
    }

    .bottom-nav button.danger {
      background: #cf3b2f;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="top">
      <div class="title">
        <span class="title-logo">
          <img class="title-logo-img" src="/static/shinnan_home_logo.png" alt="訊南 Logo">
        </span>
        <span>訊南工程 APP</span>
      </div>
      <div class="user">__USER_LINE__</div>
      <div class="sub">工程排程｜大樓網路施工｜攝影機施工</div>
    </header>

    <main class="content">
      <section id="schedule_home">
        <div class="notice">
          工程 APP 首頁顯示目前工作排程。點擊任一施工項目後，可進入該工程案的場勘、網路施工、攝影機施工、材料、日報與驗收作業。
        </div>

        <section class="summary">
          <div class="summary-card">
            <div class="summary-label">目前工程</div>
            <div id="summary_total" class="summary-value">-</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">施工中</div>
            <div id="summary_working" class="summary-value">-</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">待驗收</div>
            <div id="summary_acceptance" class="summary-value">-</div>
          </div>
        </section>

        <div class="section-title">本月工程時程表</div>
        <section id="engineering_timeline" class="timeline-wrap">
          <div class="notice">時程表讀取中...</div>
        </section>

        <div class="section-title">所有工程排程</div>
        <section id="schedule_list" class="schedule-list">
          <div class="notice">工程排程讀取中...</div>
        </section>
      </section>

      <section id="work_panel" class="work-panel">
        <div id="project_detail" class="project-detail-card"></div>

        <div class="section-title">工程作業入口</div>

        <section class="grid">
          <button class="card" type="button" onclick="phaseTodo('場勘紀錄')">
            <div class="card-head">
              <div class="card-title">場勘紀錄</div>
              <div class="card-tag">工前</div>
            </div>
            <div class="card-desc">記錄現場環境、管道、弱電箱、機房、電源、施工可行性與風險。</div>
            <div class="check-list">
              <div class="check-item">機房 / 弱電箱</div>
              <div class="check-item">管道 / 拉線路徑</div>
              <div class="check-item">電源 / 網路進線</div>
              <div class="check-item">施工風險</div>
            </div>
          </button>

          <button class="card" type="button" onclick="phaseTodo('大樓網路施工')">
            <div class="card-head">
              <div class="card-title">大樓網路施工</div>
              <div class="card-tag">網路</div>
            </div>
            <div class="card-desc">依大樓工程規範記錄配線、設備、標籤、測線、IP 規劃與完工測試。</div>
            <div class="check-list">
              <div class="check-item">光纖 / 網路線</div>
              <div class="check-item">Switch / Router</div>
              <div class="check-item">線路標籤</div>
              <div class="check-item">測線紀錄</div>
            </div>
          </button>

          <button class="card" type="button" onclick="phaseTodo('攝影機施工')">
            <div class="card-head">
              <div class="card-title">攝影機施工</div>
              <div class="card-tag">CCTV</div>
            </div>
            <div class="card-desc">記錄攝影機位置、PoE、NVR、角度、盲區、錄影測試與客戶確認。</div>
            <div class="check-list">
              <div class="check-item">攝影機位置</div>
              <div class="check-item">PoE / NVR</div>
              <div class="check-item">角度 / 盲區</div>
              <div class="check-item">錄影測試</div>
            </div>
          </button>

          <button class="card" type="button" onclick="phaseTodo('材料清單')">
            <div class="card-head">
              <div class="card-title">材料清單</div>
              <div class="card-tag">備料</div>
            </div>
            <div class="card-desc">建立工程材料用量，方便後續公司端工程系統統計與請料。</div>
            <div class="check-list">
              <div class="check-item">線材</div>
              <div class="check-item">管材</div>
              <div class="check-item">設備</div>
              <div class="check-item">消耗品</div>
            </div>
          </button>

          <button class="card" type="button" onclick="phaseTodo('施工日報')">
            <div class="card-head">
              <div class="card-title">施工日報</div>
              <div class="card-tag">日報</div>
            </div>
            <div class="card-desc">每日記錄施工進度、人員、照片、異常、阻礙與未完成項目。</div>
            <div class="check-list">
              <div class="check-item">今日進度</div>
              <div class="check-item">施工人員</div>
              <div class="check-item">異常事項</div>
              <div class="check-item">未完成項目</div>
            </div>
          </button>

          <button class="card" type="button" onclick="phaseTodo('測試驗收')">
            <div class="card-head">
              <div class="card-title">測試驗收</div>
              <div class="card-tag">驗收</div>
            </div>
            <div class="card-desc">工程完成後記錄測試結果、客戶確認、管理室確認與後續交接。</div>
            <div class="check-list">
              <div class="check-item">網路連通</div>
              <div class="check-item">攝影機畫面</div>
              <div class="check-item">客戶確認</div>
              <div class="check-item">完工交接</div>
            </div>
          </button>
        </section>

        <button type="button" class="back-project-btn" onclick="showScheduleHome()">返回工程排程</button>
      </section>
    </main>

    <nav class="bottom-nav">
      <button type="button" onclick="location.href='/app/employee/settings'">員工設定</button>
      <button type="button" class="orange" onclick="claimCurrentProject()">領用</button>
      <button type="button" class="primary" onclick="location.href='/app/engineering/schedule'">排程</button>
      <button type="button" class="green" onclick="completeCurrentProject()">完工</button>
      <button type="button" class="danger" onclick="location.href='/employee/logout?next=/app/engineering'">登出</button>
    </nav>
  </div>

    let currentProject = null;

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setText(id, value) {
      const box = document.getElementById(id);
      if (box) box.textContent = value;
    }

    function parseDateOnly(value) {
      const raw = String(value || "").trim();
      const parts = raw.split("-");
      if (parts.length !== 3) return null;
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    function formatMonthDay(date) {
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      return mm + "/" + dd;
    }

    function addDays(date, days) {
      const d = new Date(date.getTime());
      d.setDate(d.getDate() + days);
      return d;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function getMonthWeekRanges(items) {
      const baseDate = items
        .map(function(item) { return parseDateOnly(item.startDate); })
        .filter(Boolean)
        .sort(function(a, b) { return a - b; })[0] || new Date();

      const year = baseDate.getFullYear();
      const month = baseDate.getMonth();

      const monthStart = new Date(year, month, 1);
      const monthEnd = new Date(year, month + 1, 0);

      const weeks = [];
      let cursor = new Date(monthStart.getTime());
      let index = 1;

      while (cursor <= monthEnd) {
        const start = new Date(cursor.getTime());
        const end = addDays(start, 6);

        if (end > monthEnd) {
          end.setTime(monthEnd.getTime());
        }

        weeks.push({
          index: index,
          label: "第 " + index + " 週",
          rangeLabel: formatMonthDay(start) + "-" + formatMonthDay(end),
          start: start,
          end: end
        });

        cursor = addDays(end, 1);
        index += 1;
      }

      return weeks;
    }

    function getNearestTimelineItems(items) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      return items
        .map(function(item) {
          const start = parseDateOnly(item.startDate);
          const end = parseDateOnly(item.endDate);

          let distance = 999999999;

          if (start && end) {
            if (today >= start && today <= end) {
              distance = 0;
            } else if (today < start) {
              distance = start - today;
            } else {
              distance = today - end;
            }
          }

          return {item: item, distance: distance};
        })
        .sort(function(a, b) { return a.distance - b.distance; })
        .slice(0, 2)
        .map(function(x) { return x.item; });
    }

    function getWeekSpanForProject(project, weeks) {
      const start = parseDateOnly(project.startDate);
      const end = parseDateOnly(project.endDate);

      if (!start || !end || !weeks.length) {
        return null;
      }

      let startIndex = -1;
      let endIndex = -1;

      weeks.forEach(function(week, idx) {
        const overlap = start <= week.end && end >= week.start;

        if (overlap) {
          if (startIndex < 0) startIndex = idx;
          endIndex = idx;
        }
      });

      if (startIndex < 0 || endIndex < 0) {
        return null;
      }

      return {
        startIndex: startIndex,
        endIndex: endIndex,
        span: endIndex - startIndex + 1
      };
    }

    function renderEngineeringTimeline() {
      const box = document.getElementById("engineering_timeline");
      if (!box) return;

      while (box.firstChild) {
        box.removeChild(box.firstChild);
      }

      const items = Array.isArray(engineeringSchedules) ? engineeringSchedules : [];

      const notice = document.createElement("div");
      notice.className = "notice";
      notice.textContent = "目前共有 " + String(items.length) + " 件工程排程。詳細橫向時程請點底部「排程」。";

      box.appendChild(notice);
    }

    function createScheduleCard(item) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "schedule-card";
      button.onclick = function() {
        openProject(String(item.id || ""));
      };

      const head = document.createElement("div");
      head.className = "schedule-head";

      const left = document.createElement("div");

      const title = document.createElement("div");
      title.className = "project-title";
      title.textContent = String(item.building || "-") + " / " + String(item.type || "-");

      const building = document.createElement("div");
      building.className = "project-building";
      building.textContent = String(item.id || "-");

      left.appendChild(title);
      left.appendChild(building);

      const badge = document.createElement("div");
      badge.className = "status-badge " + String(item.status || "");
      badge.textContent = String(item.status || "-");

      head.appendChild(left);
      head.appendChild(badge);

      const meta = document.createElement("div");
      meta.className = "project-meta";

      const metaItems = [
        ["工期", String(item.startDate || "-") + " ～ " + String(item.endDate || "-")],
        ["天數", String(item.duration || "-")],
        ["負責", String(item.engineer || "-")],
        ["狀態", String(item.status || "-")]
      ];

      metaItems.forEach(function(pair) {
        const box = document.createElement("div");
        box.className = "meta-box";
        box.appendChild(document.createTextNode(pair[0]));

        const strong = document.createElement("strong");
        strong.textContent = pair[1];
        box.appendChild(strong);

        meta.appendChild(box);
      });

      const note = document.createElement("div");
      note.className = "project-note";
      note.textContent = String(item.note || "");

      button.appendChild(head);
      button.appendChild(meta);
      button.appendChild(note);

      return button;
    }

    function renderScheduleHome() {
      const list = document.getElementById("schedule_list");
      const items = Array.isArray(engineeringSchedules) ? engineeringSchedules : [];

      setText("summary_total", items.length);

      setText(
        "summary_working",
        items.filter(function(x) {
          return x.status === "施工中";
        }).length
      );

      setText(
        "summary_acceptance",
        items.filter(function(x) {
          return x.status === "待驗收";
        }).length
      );

      renderEngineeringTimeline();

      if (!list) return;

      while (list.firstChild) {
        list.removeChild(list.firstChild);
      }

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "notice";
        empty.textContent = "目前沒有工程排程資料。";
        list.appendChild(empty);
        return;
      }

      items.forEach(function(item) {
        list.appendChild(createScheduleCard(item));
      });
    }

    function makeDetailLine(className, textValue) {
      const div = document.createElement("div");
      div.className = className;
      div.textContent = textValue == null ? "" : String(textValue);
      return div;
    }

    function openProject(projectId) {
      const project = engineeringSchedules.find(function(x) {
        return x.id === projectId;
      });

      if (!project) {
        alert("找不到工程資料：" + projectId);
        return;
      }

      currentProject = project;

      const home = document.getElementById("schedule_home");
      const panel = document.getElementById("work_panel");
      const detail = document.getElementById("project_detail");

      if (home) home.style.display = "none";
      if (panel) panel.style.display = "block";

      if (detail) {
        while (detail.firstChild) {
          detail.removeChild(detail.firstChild);
        }

        detail.appendChild(
          makeDetailLine(
            "detail-title",
            String(project.building || "-") + " / " + String(project.type || "-")
          )
        );

        detail.appendChild(
          makeDetailLine(
            "detail-sub",
            String(project.title || "-") + " / " + String(project.status || "-")
          )
        );

        detail.appendChild(
          makeDetailLine(
            "detail-sub",
            "工期：" + String(project.startDate || "-") + " ～ " + String(project.endDate || "-") + " / " + String(project.duration || "-")
          )
        );

        detail.appendChild(
          makeDetailLine(
            "detail-sub",
            "負責：" + String(project.engineer || "-") + " / 編號：" + String(project.id || "-")
          )
        );

        detail.appendChild(
          makeDetailLine(
            "detail-note",
            String(project.note || "")
          )
        );
      }

      window.scrollTo({top: 0, behavior: "smooth"});
    }

    function showScheduleHome() {
      const home = document.getElementById("schedule_home");
      const panel = document.getElementById("work_panel");

      if (panel) panel.style.display = "none";
      if (home) home.style.display = "block";

      currentProject = null;
      renderScheduleHome();
      window.scrollTo({top: 0, behavior: "smooth"});
    }

    function claimCurrentProject() {
      if (!currentProject) {
        alert("請先點選一件工程排程，再執行領用。");
        return;
      }

      const message = [
        String(currentProject.building || "-") + " / " + String(currentProject.title || "-"),
        "已領用工程項目。"
      ].join(String.fromCharCode(10));

      alert(message);
    }

    function completeCurrentProject() {
      if (!currentProject) {
        alert("請先點選一件工程排程，再執行完工。");
        return;
      }

      const message = [
        String(currentProject.building || "-") + " / " + String(currentProject.title || "-"),
        "已送出完工回報。"
      ].join(String.fromCharCode(10));

      alert(message);
    }

    function phaseTodo(name) {
      const projectName = currentProject
        ? String(currentProject.building || "-") + " / " + String(currentProject.title || "-")
        : "未選擇工程";

      const message = [
        projectName,
        String(name || "-") + "：此功能會在下一階段接資料表與回報流程。"
      ].join(String.fromCharCode(10));

      alert(message);
    }
